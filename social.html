<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Accounts | Tawsif Al Sami</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
}

header {
    text-align: center;
    padding: 35px 15px;
    background: #111a30;
}

header h1 {
    color: #64f4ac;
    margin-bottom: 10px;
}

header p {
    color: #c4ccda;
    line-height: 1.6;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 25px 20px;
}

.card {
    background: #172139;
    border: 1px solid #293753;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
}

.card h2 {
    color: #64f4ac;
    margin-bottom: 12px;
}

.card p {
    color: #c4ccda;
    line-height: 1.6;
    margin-bottom: 22px;
}

.social-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 15px;
    margin-top: 14px;
    border-radius: 12px;
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    transition: 0.25s;
}

.social-btn:hover {
    transform: translateY(-3px);
    filter: brightness(1.1);
}

.social-btn svg {
    width: 27px;
    height: 27px;
    flex-shrink: 0;
}

.facebook {
    background: #1877F2;
}

.instagram {
    background: linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
    );
}

.back {
    display: block;
    text-align: center;
    color: #64f4ac;
    text-decoration: none;
    margin: 25px 0;
}

footer {
    text-align: center;
    color: #aaa;
    padding: 25px 15px;
}
</style>
</head>

<body>

<header>
    <h1>🔗 My Social Accounts</h1>
    <p>Connect with me on social media!</p>
</header>

<main class="container">

    <div class="card">
        <h2>🌐 Find Me Online</h2>
        <p>
            Follow my social accounts and stay connected with me.
        </p>

        <a class="social-btn facebook"
           href="https://www.facebook.com/share/1RWBLdE4K5/"
           target="_blank"
           rel="noopener noreferrer">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor"
                d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.413c0-3.025 1.792-4.707 4.533-4.707 1.312 0 2.686.236 2.686.236v2.953h-1.513c-1.491 0-1.956.93-1.956 1.886v2.292h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
            </svg>

            Facebook
        </a>

        <a class="social-btn instagram"
           href="https://www.instagram.com/sami49____/"
           target="_blank"
           rel="noopener noreferrer">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18"
                      rx="5" fill="none"
                      stroke="currentColor" stroke-width="2"/>

                <circle cx="12" cy="12" r="4"
                        fill="none"
                        stroke="currentColor" stroke-width="2"/>

                <circle cx="17.5" cy="6.5" r="1.2"
                        fill="currentColor"/>
            </svg>

            Instagram
        </a>

    </div>

    <a class="back" href="index.html">
        ← Back to Home
    </a>

</main>

<footer>
    © Tawsif Al Sami | All Rights Reserved
</footer>

</body>
</html>
