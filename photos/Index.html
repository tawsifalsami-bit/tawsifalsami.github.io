<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sami's Photo Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    padding: 20px;
}

header {
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    font-size: 30px;
    color: #60a5fa;
    margin-bottom: 10px;
}

header p {
    color: #cbd5e1;
}

.back-button {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 18px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
    max-width: 900px;
    margin: 25px auto;
}

.photo {
    background: #111a30;
    padding: 8px;
    border-radius: 12px;
    overflow: hidden;
}

.photo img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    border-radius: 8px;
}

.photo p {
    text-align: center;
    padding: 10px 0 5px;
    color: #e2e8f0;
}

footer {
    text-align: center;
    padding: 25px 10px;
    color: #94a3b8;
}

@media (max-width: 500px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    .photo img {
        height: 260px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📸 Sami's Photo Gallery</h1>
    <p>Welcome to my personal photo collection.</p>
    <a class="back-button" href="../index.html">← Back to Home</a>
</header>

<main class="gallery">

    <div class="photo">
        <img src="SAMI_01.jpg" alt="Sami Photo 1" loading="lazy">
        <p>My Photo 01</p>
    </div>

    <div class="photo">
        <img src="SAMI_02.jpg" alt="Sami Photo 2" loading="lazy">
        <p>My Photo 02</p>
    </div>

    <div class="photo">
        <img src="SAMI_03.jpg" alt="Sami Photo 3" loading="lazy">
        <p>My Photo 03</p>
    </div>

    <div class="photo">
        <img src="SAMI_04.jpg" alt="Sami Photo 4" loading="lazy">
        <p>My Photo 04</p>
    </div>

    <div class="photo">
        <img src="SAMI_05.jpg" alt="Sami Photo 5" loading="lazy">
        <p>My Photo 05</p>
    </div>

    <div class="photo">
        <img src="SAMI_06.jpg" alt="Sami Photo 6" loading="lazy">
        <p>My Photo 06</p>
    </div>

</main>

<footer>
    <p>© 2026 Sami | My Personal Gallery</p>
</footer>

</body>
</html>
