<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | Sami</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contact-card {
            background: #18233d;
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid #293653;
        }

        h1 {
            color: #64f4ac;
            margin-bottom: 20px;
        }

        p {
            color: #c2cada;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .email {
            display: block;
            color: #64f4ac;
            overflow-wrap: anywhere;
            margin-bottom: 25px;
            font-size: 17px;
        }

        .button {
            display: inline-block;
            background: #64f4ac;
            color: #0b1020;
            padding: 13px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            margin-top: 25px;
            color: #c2cada;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="contact-card">
        <h1>✉️ Contact Me</h1>

        <p>
            Want to contact me?
            Feel free to send me an email!
        </p>

        <a class="email"
           href="mailto:tawsifalsami@gmail.com">
            tawsifalsami@gmail.com
        </a>

        <a class="button"
           href="mailto:tawsifalsami@gmail.com?subject=Contact%20from%20your%20website">
            📧 Send Me an Email
        </a>

        <a class="back" href="index.html">
            ← Back to Home
        </a>
    </div>

</body>
</html>
